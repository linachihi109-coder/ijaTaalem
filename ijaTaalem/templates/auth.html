{% extends 'base.html' %}{% block body %}
<div class="container" style="max-width:440px"><div class="cardx mt-5">
<h3 class="fw-bold mb-3">{{ 'Créer un compte' if mode == 'inscription' else 'Connexion' }}</h3>
<form method="post" class="vstack gap-3">
{% if mode == 'inscription' %}<input name="nom" class="form-control" placeholder="Nom complet" required>{% endif %}
<input type="email" name="email" class="form-control" placeholder="E-mail" required>
<input type="password" name="mdp" class="form-control" placeholder="Mot de passe (6 caractères min.)" required>
<button class="btn btn-p">{{ "S'inscrire" if mode == 'inscription' else 'Se connecter' }}</button></form></div></div>{% endblock %}
